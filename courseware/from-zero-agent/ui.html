<!doctype html>
<html lang="zh">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>从零手写 Agent</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0b1521;
      color: #d7e3ee;
      font:
        14px/1.6 ui-monospace,
        Consolas,
        monospace;
    }
    #log {
      flex: 1;
      overflow: auto;
      padding: 16px;
    }
    #log div {
      white-space: pre-wrap;
      margin-bottom: 6px;
    }
    .step {
      color: #63a7d4;
      opacity: 0.75;
    }
    .tool {
      color: #e8c47a;
    }
    .result {
      color: #8ab98f;
    }
    .error {
      color: #e07b7b;
    }
    .muted {
      color: #6b7f92;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #1e2f42;
    }
    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #1e2f42;
      border-radius: 6px;
      background: #0f1d2c;
      color: inherit;
      font: inherit;
    }
    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      background: #63a7d4;
      color: #08111b;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button.ghost {
      background: #1e2f42;
      color: #d7e3ee;
    }
    #ask {
      display: none;
      gap: 10px;
      align-items: center;
      padding: 12px;
      background: #16273a;
      border-top: 1px solid #e8c47a;
    }
    #ask.show {
      display: flex;
    }
    #ask span {
      flex: 1;
      color: #e8c47a;
    }
  </style>
  <div id="log"></div>
  <div id="ask">
    <span id="askText"></span> <button id="yes">允许</button><button id="no" class="ghost">拒绝</button>
  </div>
  <form id="form">
    <input id="task" placeholder="让 agent 做点什么，例如：读一下 agent.ts 的开头" autocomplete="off" />
    <button>发送</button><button type="button" id="stop" class="ghost">停止</button>
  </form>
  <script>
    var log = document.getElementById("log")
    function add(kind, text) {
      var line = document.createElement("div")
      line.className = kind
      // 只截显示，不截回灌：模型需要全文，人不需要
      line.textContent = text.length > 600 ? text.slice(0, 600) + " …（共 " + text.length + " 字）" : text
      log.appendChild(line)
      log.scrollTop = log.scrollHeight
    }
    function post(path, body) {
      return fetch(path, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body || {}),
      })
    }
    var askBox = document.getElementById("ask")
    var askText = document.getElementById("askText")
    new EventSource("/events").onmessage = function (event) {
      var e = JSON.parse(event.data)
      if (e.type === "step") add("step", "— 第 " + e.step + " 步 —")
      if (e.type === "text") add("text", e.text)
      if (e.type === "tool") add("tool", "→ " + e.name + " " + JSON.stringify(e.args))
      if (e.type === "result") add("result", "← " + e.text)
      if (e.type === "error") {
        add("error", "! " + e.text)
        askBox.classList.remove("show")
      }
      if (e.type === "done") add("muted", "✓ " + e.text)
      if (e.type === "idle") askBox.classList.remove("show")
      if (e.type === "ask") {
        askText.textContent = "允许 " + e.name + " " + e.target + " ?"
        askBox.classList.add("show")
      }
    }
    document.getElementById("yes").onclick = function () {
      askBox.classList.remove("show")
      post("/answer", { allow: true })
    }
    document.getElementById("no").onclick = function () {
      askBox.classList.remove("show")
      post("/answer", { allow: false })
    }
    document.getElementById("stop").onclick = function () {
      askBox.classList.remove("show")
      post("/stop")
    }
    document.getElementById("form").onsubmit = function (event) {
      event.preventDefault()
      var input = document.getElementById("task")
      if (!input.value.trim()) return
      add("muted", "我：" + input.value)
      post("/run", { task: input.value })
      input.value = ""
    }
  </script>
</html>
